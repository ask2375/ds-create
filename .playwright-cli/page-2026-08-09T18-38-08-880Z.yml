  - main [ref=f2e11]:
    - generic [ref=f2e14]:
      - heading "【開発環境セットアップ手順】" [level=2] [ref=f2e15]
      - paragraph [ref=f2e16]:
        - text: この静的開発サーバー（
        - code [ref=f2e17]: http://localhost:5173
        - text: ）は起動したままでOKです。
      - paragraph [ref=f2e18]: WordPressテーマ開発を行う場合は、別ターミナルで以下を実行してください：
      - list [ref=f2e19]:
        - listitem [ref=f2e20]:
          - strong [ref=f2e21]: Docker Desktop を起動
          - text: （ステータスバーに "running" と表示されていることを確認）
        - listitem [ref=f2e22]:
          - strong [ref=f2e23]: WordPress環境を起動
          - code [ref=f2e24]: $ yarn wp-start
          - text: → 初回は5-10分程度かかります → 完了すると
          - code [ref=f2e25]: http://localhost:8888
          - text: でWordPressにアクセスできます
        - listitem [ref=f2e26]:
          - strong [ref=f2e27]: WordPress初期設定を適用
          - text: （初回のみ）
          - code [ref=f2e28]: $ yarn wp-init
          - text: → タイムゾーン・パーマリンク・フロントページ・シード投稿を自動設定 →
          - strong [ref=f2e29]: テーマの有効化も自動で実行されます
          - text: （手動操作不要）
        - listitem [ref=f2e30]:
          - strong [ref=f2e31]: WordPress管理画面にログイン
          - text: "（初回のみ） → URL:"
          - code [ref=f2e32]: http://localhost:8888/wp-admin/
          - text: "→ ID:"
          - code [ref=f2e33]: admin
          - text: "/ パスワード:"
          - code [ref=f2e34]: password
          - text: →
          - strong [ref=f2e35]: 言語設定は既に日本語になっています
          - text: （
          - code [ref=f2e36]: .wp-env.json
          - text: の設定により自動適用）
        - listitem [ref=f2e37]:
          - strong [ref=f2e38]: 開発作業
          - text: →
          - code [ref=f2e39]: src/
          - text: フォルダ内でHTML/SCSS/JavaScriptを編集 → 変更は自動的に反映されます（手動リロードが必要な場合あり） → WordPress環境（
          - code [ref=f2e40]: localhost:8888
          - text: ）で確認しながら開発
      - paragraph [ref=f2e41]:
        - text: "終了時:"
        - code [ref=f2e42]: $ yarn wp-stop
      - paragraph [ref=f2e43]:
        - text: 詳細は
        - code [ref=f2e44]: README.md
        - text: を参照してください。
