  - main [ref=e25]:
    - generic [ref=e28]:
      - heading "【開発環境セットアップ手順】" [level=2] [ref=e29]
      - paragraph [ref=e30]:
        - text: この静的開発サーバー（
        - code [ref=e31]: http://localhost:5173
        - text: ）は起動したままでOKです。
      - paragraph [ref=e32]: WordPressテーマ開発を行う場合は、別ターミナルで以下を実行してください：
      - list [ref=e33]:
        - listitem [ref=e34]:
          - strong [ref=e35]: Docker Desktop を起動
          - text: （ステータスバーに "running" と表示されていることを確認）
        - listitem [ref=e36]:
          - strong [ref=e37]: WordPress環境を起動
          - code [ref=e38]: $ yarn wp-start
          - text: → 初回は5-10分程度かかります → 完了すると
          - code [ref=e39]: http://localhost:8888
          - text: でWordPressにアクセスできます
        - listitem [ref=e40]:
          - strong [ref=e41]: WordPress初期設定を適用
          - text: （初回のみ）
          - code [ref=e42]: $ yarn wp-init
          - text: → タイムゾーン・パーマリンク・フロントページ・シード投稿を自動設定 →
          - strong [ref=e43]: テーマの有効化も自動で実行されます
          - text: （手動操作不要）
        - listitem [ref=e44]:
          - strong [ref=e45]: WordPress管理画面にログイン
          - text: "（初回のみ） → URL:"
          - code [ref=e46]: http://localhost:8888/wp-admin/
          - text: "→ ID:"
          - code [ref=e47]: admin
          - text: "/ パスワード:"
          - code [ref=e48]: password
          - text: →
          - strong [ref=e49]: 言語設定は既に日本語になっています
          - text: （
          - code [ref=e50]: .wp-env.json
          - text: の設定により自動適用）
        - listitem [ref=e51]:
          - strong [ref=e52]: 開発作業
          - text: →
          - code [ref=e53]: src/
          - text: フォルダ内でHTML/SCSS/JavaScriptを編集 → 変更は自動的に反映されます（手動リロードが必要な場合あり） → WordPress環境（
          - code [ref=e54]: localhost:8888
          - text: ）で確認しながら開発
      - paragraph [ref=e55]:
        - text: "終了時:"
        - code [ref=e56]: $ yarn wp-stop
      - paragraph [ref=e57]:
        - text: 詳細は
        - code [ref=e58]: README.md
        - text: を参照してください。
